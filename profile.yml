  "product manag": 4          # matches manager / management
  "associate product": 4
  "apm": 4
  "product intern": 4
  "product strategy": 4
  "product analyst": 3
  "product operations": 3
  "founder": 4                # founder's office, founders office
  "chief of staff": 4
  "strategy": 3
  "growth": 3
  "business operations": 3
  "bizops": 3
  "strategy & operations": 3
  "operations": 2
  "go-to-market": 2
  "gtm": 2
  "consult": 2                # consultant / consulting
  "business analyst": 2
  "business development": 2
  "partnerships": 2
  "venture": 2
  "program manag": 2
  "summer analyst": 2
  "business intern": 2

