name: Scan for internships

on:
  schedule:
    - cron: "17 1 * * *"    # ~06:47 IST every day
    - cron: "17 13 * * *"   # ~18:47 IST every day
  workflow_dispatch: {}      # lets you press "Run workflow" by hand
  push:
    paths:
      - profile.yml
      - companies.txt
      - scanner/**

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scanner/scan.py
      - name: Save results
        run: |
          git config user.name "internship-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/jobs.json docs/dropped.json data/seen.json data/discovered.json
          git diff --cached --quiet || git commit -m "Update internships $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push
